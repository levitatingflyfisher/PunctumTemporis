name: one_second_a_day
description: Capture one second of video every day. Retro aesthetic, local-first.
publish_to: 'none'
version: 1.5.0+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Camera & Media
  camera: ^0.10.6
  video_player: ^2.8.2
  image: ^4.0.0 # crop face thumbnails to the detected box (privacy)
  media_scanner: ^2.1.0
  photo_manager: ^3.6.0
  
  # Video Processing
  ffmpeg_kit_flutter_new: ^4.1.0
  
  # File & Storage
  file_picker: ^10.0.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  
  # Geolocation
  geolocator: ^13.0.2

  # Face Recognition
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.11.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0

  # Backup & Sharing
  archive: ^4.0.0
  # Snapshot-vault primitives (BackupVault/FileVaultStore) for the
  # metadata vault + mandatory pre-restore snapshot. PT stays plaintext —
  # it uses the retention machinery, not the crypto flows.
  sanctuary_backup_ui:
    path: ../packages/sanctuary_backup_ui
  share_plus: ^10.0.0

  # Home Screen Widget
  home_widget: ^0.6.0

  # UI
  intl: ^0.20.2
  uuid: ^4.3.3
  # Canonical OpenHearth design grammar: PT's Hearth palette, the colour
  # roles every style attaches (one urgency red), Hearth's Lora/Nunito as
  # package fonts, and the shared error, delete, theme and page widgets.
  openhearth_design:
    path: ../ohStyle/openhearth_design

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Fleet standards as tests that can fail (test/fleet_conformance_test.dart).
  oh_fleet_conformance:
    path: ../packages/oh_fleet_conformance

  # Tests mock the path_provider platform channel directly.
  path_provider_platform_interface: ^2.1.2
flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/models/
    - assets/data/
    - assets/fonts/

  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: Roboto Mono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon_foreground.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
